<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactions Claude builds for Yann in waves. Only the ones he kept are here." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111110" />
    <meta property="og:title" content="interaction lab" />
    <meta property="og:description" content="Interactions Claude builds for Yann in waves. Only the ones he kept are here." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ultrararebinary.github.io/interaction-lab/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>interaction lab</title>
    <script>
      // Set the theme before the first paint, so a light-mode visitor never sees a dark flash.
      try {
        const stored = localStorage.getItem('theme')
        document.documentElement.dataset.theme =
          stored ?? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
      if (document.documentElement.dataset.theme === 'light') {
        document.querySelector('meta[name="theme-color"]').content = '#fdfdfc'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
